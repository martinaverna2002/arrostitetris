</svg>
<script>
const PIECE_TYPES = ['t_pezzo_1', 't_pezzo_2', 't_pezzo_3', 't_pezzo_4', 't_pezzo_5', 't_pezzo_6', 't_pezzo_7'];
const PIECE_LAND_Y = {
  't_pezzo_1': 533,
  't_pezzo_2': 495,
  't_pezzo_3': 444,
  't_pezzo_4': 406,
  't_pezzo_5': 368,
  't_pezzo_6': 330,
  't_pezzo_7': 292,
};
const FALL_SPEED = 4;
const SLIDE_SPEED = 3;
const GAME_AREA_LEFT = 51.05;
const GAME_AREA_RIGHT = 344.18;
const GAME_AREA_TOP = 49.95;
const GAME_AREA_BOTTOM = 573.66;
const STECCHINO_CENTER_X = 197.5;
const SPAWN_Y = GAME_AREA_TOP;
const CONFETTI_COLORS = ['#e30613', '#36a9e1', '#f9b233', '#e52b3a', '#1d71b8', '#683c11', '#7d4e24'];
const ROTTEN_CHANCE = 0.25;
const MOLD_SPOTS = [
  { dx: -14, dy: -20, r: 6 }, { dx: 10, dy: -14, r: 5 },
  { dx: -10, dy: 14, r: 7 },  { dx: 20, dy: 4, r: 5 },
  { dx: -22, dy: 4, r: 6 },  { dx: 6, dy: -26, r: 5 },
  { dx: -6, dy: 22, r: 5 },  { dx: 18, dy: -8, r: 6 },
];

const STATE = { IDLE: 0, COUNTDOWN: 1, PLAYING: 2, PAUSED: 3, WIN: 4 };

let stecchinoX = STECCHINO_CENTER_X;
let pieces = [];
let currentPiece = null;
let pieceQueue = [];

let isRunning = false;
let gameActive = false;
let fallingUse = null;
let fallingMold = [];
let countdownInterval = null;
let startTimeout = null;
let state = STATE.IDLE;
let lives = 3;

const svg = document.querySelector('#Poster');
const gameArea = document.getElementById('game-area');
const movingGroup = document.getElementById('moving-group');
const landedContainer = document.getElementById('landed-pieces');
const startBtn = document.getElementById('start-btn');
const countdownEl = document.getElementById('countdown');
const pauseIcon = document.getElementById('pause-icon');
const winText = document.getElementById('win-text');
const confettiContainer = document.getElementById('confetti-container');
const heartGroups = [
  document.getElementById('cuore_1'),
  document.getElementById('cuore_2'),
  document.getElementById('cuore_3'),
];

function renderSkewer() {
  const currentOffset = stecchinoX - STECCHINO_CENTER_X;
  movingGroup.setAttribute('transform', 'translate(' + currentOffset + ', 0)');
}

svg.addEventListener('mousemove', (e) => {
  const rect = svg.getBoundingClientRect();
  const scaleX = 595.28 / rect.width;
  const svgX = (e.clientX - rect.left) * scaleX;
  stecchinoX = Math.max(GAME_AREA_LEFT + 25, Math.min(GAME_AREA_RIGHT - 25, svgX));
  renderSkewer();
});

function fillQueue() {
  pieceQueue = [...PIECE_TYPES].reverse();
}

function spawnNextPiece() {
  if (pieceQueue.length === 0) {
    pieces = [];
    landedContainer.innerHTML = '';
    fillQueue();
  }
  const type = pieceQueue.pop();
  const spawnX = GAME_AREA_LEFT + 25 + Math.random() * (GAME_AREA_RIGHT - GAME_AREA_LEFT - 50);
  currentPiece = {
    type: type,
    x: spawnX,
    y: SPAWN_Y,
    targetY: PIECE_LAND_Y[type],
    isRotten: Math.random() < ROTTEN_CHANCE,
    moldCircles: null,
  };
}

function resetGame() {
  isRunning = false;
  gameActive = false;
  clearInterval(countdownInterval);
  clearTimeout(startTimeout);
  pieces = [];
  currentPiece = null;
  if (fallingUse) { fallingUse.remove(); fallingUse = null; }
  fallingMold.forEach(c => c.remove());
  fallingMold = [];
  pieceQueue = [];
  landedContainer.innerHTML = '';
  stecchinoX = STECCHINO_CENTER_X;
  renderSkewer();
  countdownEl.setAttribute('visibility', 'hidden');
  pauseIcon.setAttribute('visibility', 'hidden');
  winText.setAttribute('visibility', 'hidden');
  confettiContainer.innerHTML = '';
}

function startCountdown() {
  countdownEl.textContent = 3;
  countdownEl.setAttribute('visibility', 'visible');
  let count = 3;
  countdownInterval = setInterval(() => {
    count--;
    if (count === 0) {
      countdownEl.setAttribute('visibility', 'hidden');
      clearInterval(countdownInterval);
      startTimeout = setTimeout(startGame, 2000);
    } else {
      countdownEl.textContent = count;
    }
  }, 1000);
}

function cancelCountdown() {
  clearInterval(countdownInterval);
  clearTimeout(startTimeout);
  countdownEl.setAttribute('visibility', 'hidden');
}

function pauseGame() {
  state = STATE.PAUSED;
  isRunning = false;
  pauseIcon.setAttribute('visibility', 'visible');
}

function resumeGame() {
  state = STATE.PLAYING;
  isRunning = true;
  pauseIcon.setAttribute('visibility', 'hidden');
  update();
}

function resetToIdle() {
  resetGame();
  resetLives();
  state = STATE.IDLE;
}

function winGame() {
  state = STATE.WIN;
  isRunning = false;
  winText.textContent = 'YOU WIN';
  winText.setAttribute('visibility', 'visible');
  spawnConfetti();
  startTimeout = setTimeout(resetToIdle, 5000);
}

function spawnConfetti() {
  for (let i = 0; i < 8; i++) {
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', 51 + Math.random() * 243);
    rect.setAttribute('y', -20 + Math.random() * -50);
    rect.setAttribute('width', 4 + Math.random() * 10);
    rect.setAttribute('height', 3 + Math.random() * 8);
    rect.setAttribute('fill', CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]);
    rect.setAttribute('rx', 1);
    rect.classList.add('confetti');
    rect.style.animationDelay = (Math.random() * 0.5) + 's';
    rect.style.animationDuration = (2 + Math.random() * 2) + 's';
    confettiContainer.appendChild(rect);
  }
}

function createMold(x, y, parent, pieceObj) {
  pieceObj.moldEls = [];
  for (const spot of MOLD_SPOTS) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x + spot.dx);
    c.setAttribute('cy', y + spot.dy);
    c.setAttribute('r', spot.r);
      c.setAttribute('fill', '#e30613');
      c.setAttribute('opacity', '0.9');
    parent.appendChild(c);
    pieceObj.moldEls.push(c);
  }
}

function loseLife() {
  if (lives <= 0) return;
  lives--;
  const idx = lives; // 0, 1, 2
  if (heartGroups[idx]) heartGroups[idx].style.display = 'none';
  if (lives === 0) {
    state = STATE.WIN;
    isRunning = false;
    winText.textContent = 'GAME OVER';
    winText.setAttribute('visibility', 'visible');
    startTimeout = setTimeout(resetToIdle, 3000);
  }
}

function resetLives() {
  lives = 3;
  heartGroups.forEach(g => { if (g) g.style.display = ''; });
}

function startGame() {
  state = STATE.PLAYING;
  gameActive = true;
  isRunning = true;
  fillQueue();
  spawnNextPiece();
  update();
}

startBtn.addEventListener('click', () => {
  switch (state) {
    case STATE.IDLE:
      state = STATE.COUNTDOWN;
      startCountdown();
      break;
    case STATE.COUNTDOWN:
      cancelCountdown();
      resetToIdle();
      break;
    case STATE.PLAYING:
      pauseGame();
      break;
    case STATE.PAUSED:
      resumeGame();
      break;
    case STATE.WIN:
      resetToIdle();
      break;
  }
});

function update() {
  if (!isRunning) return;

  if (currentPiece) {
    currentPiece.y += FALL_SPEED;

    const collisionX = Math.abs(currentPiece.x - stecchinoX) < 28;
    const collisionY = Math.abs(currentPiece.y - 210) < 24;

    if (collisionX && collisionY) {
      if (currentPiece.isRotten) {
        loseLife();
        if (fallingUse) { fallingUse.remove(); fallingUse = null; }
        fallingMold.forEach(c => c.remove());
        fallingMold = [];
        currentPiece = null;
        if (state !== STATE.WIN && pieceQueue.length > 0) spawnNextPiece();
      } else {
        const offset = currentPiece.x - stecchinoX;
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '#' + currentPiece.type);
        use.setAttribute('transform', 'translate(' + (STECCHINO_CENTER_X + offset) + ', ' + currentPiece.y + ')');
        landedContainer.appendChild(use);
        if (currentPiece.isRotten) createMold(STECCHINO_CENTER_X + offset, currentPiece.y, landedContainer, currentPiece);
        currentPiece.sliding = true;
        currentPiece.use = use;
        currentPiece.offset = offset;
        pieces.push(currentPiece);
        currentPiece = null;
        if (pieceQueue.length > 0) spawnNextPiece();
      }
    }

    if (currentPiece && currentPiece.y > GAME_AREA_BOTTOM) {
      currentPiece.y = SPAWN_Y;
      currentPiece.x = GAME_AREA_LEFT + 25 + Math.random() * (GAME_AREA_RIGHT - GAME_AREA_LEFT - 50);
    }
  }

  for (const p of pieces) {
    if (p.sliding) {
      p.y += SLIDE_SPEED;
      if (p.y >= p.targetY) {
        p.y = p.targetY;
        p.sliding = false;
      }
    }
  }

  if (!currentPiece && pieces.length > 0 && !pieces[pieces.length - 1].sliding) {
    if (pieceQueue.length === 0) {
      if (lives > 0) winGame();
    } else {
      spawnNextPiece();
    }
  }

  render();
  requestAnimationFrame(update);
}

function render() {
  const currentOffset = stecchinoX - STECCHINO_CENTER_X;
  movingGroup.setAttribute('transform', 'translate(' + currentOffset + ', 0)');

  for (const p of pieces) {
    if (p.sliding && p.use) {
      p.use.setAttribute('transform', 'translate(' + (STECCHINO_CENTER_X + (p.offset || 0)) + ', ' + p.y + ')');
    }
    if (p.sliding && p.isRotten && p.moldEls) {
      p.moldEls.forEach((el, i) => {
        el.setAttribute('cy', p.y + MOLD_SPOTS[i].dy);
      });
    }
  }

  if (currentPiece) {
    if (!fallingUse) {
      fallingUse = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      fallingUse.setAttribute('href', '#' + currentPiece.type);
      gameArea.appendChild(fallingUse);
      if (currentPiece.isRotten) {
        for (const spot of MOLD_SPOTS) {
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', currentPiece.x + spot.dx);
          c.setAttribute('cy', currentPiece.y + spot.dy);
          c.setAttribute('r', spot.r);
          c.setAttribute('fill', '#4a7c2e');
          c.setAttribute('opacity', '0.85');
          gameArea.appendChild(c);
          fallingMold.push(c);
        }
      }
    } else {
      fallingUse.setAttribute('href', '#' + currentPiece.type);
      fallingMold.forEach((c, i) => {
        c.setAttribute('cx', currentPiece.x + MOLD_SPOTS[i].dx);
        c.setAttribute('cy', currentPiece.y + MOLD_SPOTS[i].dy);
      });
    }
    fallingUse.setAttribute('transform', 'translate(' + currentPiece.x + ', ' + currentPiece.y + ')');
  } else if (fallingUse) {
    fallingUse.remove();
    fallingMold.forEach(c => c.remove());
    fallingMold = [];
    fallingUse = null;
  }
}

document.addEventListener('visibilitychange', () => {
  isRunning = !document.hidden && gameActive;
  if (isRunning) update();
});
</script>
